## clawed.chat backend — Fly.io
## Secrets are managed in Doppler (clawed-chat/dev) and imported via:
##   doppler secrets download --no-file --format env | fly secrets import

app = "clawed-chat"
primary_region = "sjc"  # near San Francisco (boat day)

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1   # keep one warm so the judge endpoint never cold-starts

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "15s"
  timeout = "10s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
