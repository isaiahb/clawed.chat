# clawed.chat CI/CD — deploy backend to GCP on push to isaiah branch
#
# Optimized two-phase deploy:
#   1. Pulumi ensures our backend GCP VM + DNS exists (SKIPPED if only app code changed)
#   2. SSH into the VM, upload code, run remote-deploy.sh
#
# Required GitHub Secrets:
#   PULUMI_ACCESS_TOKEN      — from app.pulumi.com/account/tokens
#   GCP_CREDENTIALS_BASE64   — base64-encoded service account JSON key
#   CLOUDFLARE_API_TOKEN     — from Cloudflare dashboard (Edit zone DNS)
#   APP_ENV                  — full contents of app/.env (all secrets)

name: Deploy

on:
  push:
    branches: [isaiah]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVER_NAME: clawed-chat-server
  GCP_ZONE: ${{ vars.GCP_ZONE || 'us-west1-a' }}
  GCP_PROJECT: ${{ vars.GCP_PROJECT || 'clawed-chat' }}
  APP_DIR: /opt/clawed-chat

jobs:
  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit for change detection

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup GCP credentials
        run: |
          echo "${{ secrets.GCP_CREDENTIALS_BASE64 }}" | base64 -d > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Authenticate gcloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_BASE64 }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      # ── Phase 1: Infrastructure (only if deploy/ changed) ────────────

      - name: Check if infra changed
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^deploy/'; then
            echo "infra=true" >> $GITHUB_OUTPUT
          else
            echo "infra=false" >> $GITHUB_OUTPUT
          fi
          # Always run on workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "infra=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Pulumi dependencies
        if: steps.changes.outputs.infra == 'true'
        run: bun install
        working-directory: deploy

      - name: Pulumi up (ensure VM + DNS exist)
        if: steps.changes.outputs.infra == 'true'
        run: |
          cd deploy
          bunx pulumi login
          bunx pulumi up --yes --stack dev
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ── Phase 2: Deploy App Code (single SSH session) ──────────────

      - name: Upload code + secrets to server
        run: |
          # Prepare all files locally
          tar czf /tmp/code.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='deploy/node_modules' \
            .
          echo '${{ secrets.APP_ENV }}' > /tmp/app.env

          # Upload all files in parallel via single scp
          gcloud compute scp \
            --zone="${{ env.GCP_ZONE }}" \
            --compress \
            --quiet \
            /tmp/code.tar.gz \
            /tmp/app.env \
            /tmp/gcp-key.json \
            "${{ env.SERVER_NAME }}:/tmp/"

          # Run everything on the server in a single SSH session
          gcloud compute ssh "${{ env.SERVER_NAME }}" \
            --zone="${{ env.GCP_ZONE }}" \
            --quiet \
            --command="
              sudo rm -rf ${{ env.APP_DIR }}-new &&
              sudo mkdir -p ${{ env.APP_DIR }}-new &&
              sudo tar xzf /tmp/code.tar.gz -C ${{ env.APP_DIR }}-new &&
              sudo mkdir -p ${{ env.APP_DIR }}-new/app &&
              sudo mv /tmp/app.env ${{ env.APP_DIR }}-new/app/.env &&
              sudo mv /tmp/gcp-key.json /opt/gcp-sa-key.json &&
              rm -f /tmp/code.tar.gz &&
              sudo bash ${{ env.APP_DIR }}-new/scripts/remote-deploy.sh
            "

      # ── Phase 3: Verify ───────────────────────────────────────────────

      - name: Verify deployment
        run: |
          echo "Testing health endpoint..."
          for i in $(seq 1 10); do
            STATUS=$(curl -sf "https://clawed.chat/api/health" 2>/dev/null | jq -r '.status' 2>/dev/null || echo "unreachable")
            if [ "$STATUS" = "ok" ]; then
              echo "✅ Deploy verified — server is healthy via HTTPS"
              exit 0
            fi
            sleep 3
          done
          echo "⚠️ Could not verify via HTTPS — trying direct IP..."
          curl -sf "http://${{ env.SERVER_NAME }}:80/api/health" 2>/dev/null || echo "WARNING: Server may still be starting"

      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Infra changed** | ${{ steps.changes.outputs.infra }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | https://clawed.chat |" >> $GITHUB_STEP_SUMMARY
