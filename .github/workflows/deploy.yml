# clawed.chat CI/CD — deploy backend to GCP on push to isaiah branch
#
# Two-phase deploy:
#   1. Pulumi ensures our backend GCP VM + DNS exists (infra)
#   2. SSH into the VM, upload code, run remote-deploy.sh
#
# Required GitHub Secrets:
#   PULUMI_ACCESS_TOKEN      — from app.pulumi.com/account/tokens
#   GCP_CREDENTIALS_BASE64   — base64-encoded service account JSON key
#   CLOUDFLARE_API_TOKEN     — from Cloudflare dashboard (Edit zone DNS)
#   APP_ENV                  — full contents of app/.env (all secrets)
#
# Required GitHub Variables:
#   GCP_PROJECT              — clawed-chat
#   GCP_ZONE                 — us-west1-a

name: Deploy

on:
  push:
    branches: [isaiah]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVER_NAME: clawed-chat-server
  GCP_ZONE: ${{ vars.GCP_ZONE || 'us-west1-a' }}
  GCP_PROJECT: ${{ vars.GCP_PROJECT || 'clawed-chat' }}
  APP_DIR: /opt/clawed-chat

jobs:
  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup GCP credentials
        run: |
          echo "${{ secrets.GCP_CREDENTIALS_BASE64 }}" | base64 -d > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Authenticate gcloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_BASE64 }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      # ── Phase 1: Infrastructure (Pulumi via Bun) ────────────────────────

      - name: Install Pulumi dependencies
        run: bun install
        working-directory: deploy

      - name: Pulumi up (ensure VM + DNS exist)
        run: |
          cd deploy
          bunx pulumi login
          bunx pulumi up --yes --stack dev
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Get server IP from Pulumi
        id: infra
        run: |
          cd deploy
          SERVER_IP=$(bunx pulumi stack output serverIp --stack dev 2>/dev/null || echo "")
          echo "server_ip=$SERVER_IP" >> $GITHUB_OUTPUT
          echo "Server IP: $SERVER_IP"
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # ── Phase 2: Deploy App Code ──────────────────────────────────────

      - name: Upload code to server
        run: |
          tar czf /tmp/code.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='deploy/node_modules' \
            .
          gcloud compute scp \
            --zone="${{ env.GCP_ZONE }}" \
            --compress \
            --quiet \
            /tmp/code.tar.gz \
            "${{ env.SERVER_NAME }}:/tmp/code.tar.gz"
          gcloud compute ssh "${{ env.SERVER_NAME }}" \
            --zone="${{ env.GCP_ZONE }}" \
            --quiet \
            --command="sudo rm -rf ${{ env.APP_DIR }}-new && sudo mkdir -p ${{ env.APP_DIR }}-new && sudo tar xzf /tmp/code.tar.gz -C ${{ env.APP_DIR }}-new && rm /tmp/code.tar.gz"

      - name: Upload env file
        run: |
          echo '${{ secrets.APP_ENV }}' > /tmp/app.env
          gcloud compute scp \
            --zone="${{ env.GCP_ZONE }}" \
            --quiet \
            /tmp/app.env \
            "${{ env.SERVER_NAME }}:/tmp/app.env"
          gcloud compute ssh "${{ env.SERVER_NAME }}" \
            --zone="${{ env.GCP_ZONE }}" \
            --quiet \
            --command="sudo mv /tmp/app.env ${{ env.APP_DIR }}-new/app/.env"

      - name: Upload GCP service account key
        run: |
          gcloud compute scp \
            --zone="${{ env.GCP_ZONE }}" \
            --quiet \
            /tmp/gcp-key.json \
            "${{ env.SERVER_NAME }}:/tmp/gcp-sa-key.json"
          gcloud compute ssh "${{ env.SERVER_NAME }}" \
            --zone="${{ env.GCP_ZONE }}" \
            --quiet \
            --command="sudo mv /tmp/gcp-sa-key.json /opt/gcp-sa-key.json"

      - name: Run deploy script on server
        run: |
          gcloud compute ssh "${{ env.SERVER_NAME }}" \
            --zone="${{ env.GCP_ZONE }}" \
            --quiet \
            --command="sudo bash ${{ env.APP_DIR }}-new/scripts/remote-deploy.sh"

      # ── Phase 3: Verify ───────────────────────────────────────────────

      - name: Verify deployment
        if: steps.infra.outputs.server_ip != ''
        run: |
          echo "Testing health endpoint at ${{ steps.infra.outputs.server_ip }}..."
          for i in $(seq 1 10); do
            STATUS=$(curl -sf "http://${{ steps.infra.outputs.server_ip }}:3000/api/health" 2>/dev/null | jq -r '.status' 2>/dev/null || echo "unreachable")
            if [ "$STATUS" = "ok" ]; then
              echo "Deploy verified — server is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "WARNING: Could not verify deploy — server may still be starting"

      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Server IP** | \`${{ steps.infra.outputs.server_ip }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | https://clawed.chat |" >> $GITHUB_STEP_SUMMARY
          echo "| **Health** | http://${{ steps.infra.outputs.server_ip }}:3000/api/health |" >> $GITHUB_STEP_SUMMARY
