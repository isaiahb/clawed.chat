<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#0a0a0a"/>
  <g transform="translate(16, 16) scale(0.85)">
    <!-- Bottom jaw of claw -->
    <path d="M-10 2 C-10 2, -6 8, 2 10 C6 11, 12 8, 14 4 C14 4, 10 6, 6 5 C2 4, -4 2, -10 2Z" fill="#8B0000" stroke="#cc0000" stroke-width="0.5"/>
    <!-- Top jaw of claw -->
    <path d="M-10 -1 C-10 -1, -6 -8, 2 -10 C6 -11, 12 -6, 14 -2 C14 -2, 10 -5, 6 -4 C2 -3, -4 -1, -10 -1Z" fill="#cc0000" stroke="#ff2222" stroke-width="0.5">
      <animateTransform attributeName="transform" type="rotate" values="0 -10 0;-8 -10 0;0 -10 0" dur="1.5s" repeatCount="indefinite" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" calcMode="spline"/>
    </path>
    <!-- Joint -->
    <circle cx="-10" cy="0.5" r="3" fill="#660000" stroke="#8B0000" stroke-width="0.5"/>
    <!-- Serrated edges on top -->
    <path d="M0 -9 L1.5 -7.5 M4 -10 L5 -8 M8 -8 L8.5 -6" stroke="#ff3333" stroke-width="0.6" stroke-linecap="round" opacity="0.7"/>
    <!-- Serrated edges on bottom -->
    <path d="M0 9 L1.5 7.5 M4 10 L5 8 M8 7 L8.5 5.5" stroke="#cc2222" stroke-width="0.6" stroke-linecap="round" opacity="0.6"/>
    <!-- Highlight -->
    <path d="M-6 -5 C-4 -7, 2 -8, 6 -6" fill="none" stroke="#ff4444" stroke-width="0.4" opacity="0.5"/>
  </g>
</svg>
